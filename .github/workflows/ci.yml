name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual trigger from the Actions tab. Also the fallback if a push ever fails
  # to fire the workflow — GitHub registered this file on the repository's first
  # commit without running it, so there is value in being able to ask directly.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      # The second tenant is part of the contract, so prove it still compiles.
      - name: Build alternate tenant
        run: npm run build
        env:
          VITE_TENANT: priceline
